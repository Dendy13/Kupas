# =============================================================================
# Kupas — Nginx Configuration
# Domain: kupas.dendyfajark.page (frontend via Vercel)
#         api.kupas.dendyfajark.page (FastAPI di VPS)
#
# Deployment:
#   sudo cp nginx-example.conf /etc/nginx/sites-available/kupas
#   sudo ln -s /etc/nginx/sites-available/kupas /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# SSL:
#   sudo certbot --nginx -d api.kupas.dendyfajark.page -d admin.kupas.dendyfajark.page
# =============================================================================

# ─── API: api.kupas.dendyfajark.page → FastAPI port 8000 ─────────────────────
server {
    listen 80;
    server_name api.kupas.dendyfajark.page;

    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # CORS — izinkan request dari frontend Vercel
        add_header Access-Control-Allow-Origin  "https://kupas.dendyfajark.page" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }
}

# ─── Admin Panel: admin.kupas.dendyfajark.page → port 8001 ───────────────────
server {
    listen 80;
    server_name admin.kupas.dendyfajark.page;

    # Uncomment untuk restrict akses hanya dari IP tertentu:
    # allow 123.123.123.123;
    # deny all;

    location / {
        proxy_pass         http://127.0.0.1:8001;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Authorization     $http_authorization;
        proxy_pass_header  Authorization;
    }
}

# =============================================================================
# Systemd service — FastAPI (API)
# Simpan di: /etc/systemd/system/kupas-api.service
# =============================================================================
#
# [Unit]
# Description=Kupas API (FastAPI)
# After=network.target postgresql.service
#
# [Service]
# User=www-data
# WorkingDirectory=/var/www/kupas
# ExecStart=/var/www/kupas/.venv/bin/uvicorn kupas.api.main:app --host 127.0.0.1 --port 8000
# Restart=always
# EnvironmentFile=/var/www/kupas/.env
#
# [Install]
# WantedBy=multi-user.target
#
# =============================================================================
# Systemd service — Admin Panel
# Simpan di: /etc/systemd/system/kupas-admin.service
# =============================================================================
#
# [Unit]
# Description=Kupas Admin Panel
# After=network.target postgresql.service
#
# [Service]
# User=www-data
# WorkingDirectory=/var/www/kupas
# ExecStart=/var/www/kupas/.venv/bin/uvicorn kupas.admin.main:app --host 127.0.0.1 --port 8001
# Restart=always
# EnvironmentFile=/var/www/kupas/.env
#
# [Install]
# WantedBy=multi-user.target
