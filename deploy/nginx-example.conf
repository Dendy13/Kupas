# =============================================================================
# Kupas — Nginx Configuration Example
# Two subdomains serving separate FastAPI apps from the same server.
#
# Deployment:
#   sudo cp nginx-example.conf /etc/nginx/sites-available/kupas
#   sudo ln -s /etc/nginx/sites-available/kupas /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# =============================================================================

# ─── Public API: api.kupas.id → port 8000 ────────────────────────────────────
server {
    listen 80;
    server_name api.kupas.id;

    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}

# ─── Admin Panel: admin.kupas.id → port 8001 ─────────────────────────────────
server {
    listen 80;
    server_name admin.kupas.id;

    # Optional: restrict to trusted IPs only (recommended for production)
    # allow 123.123.123.123;   # your office/home IP
    # deny all;

    location / {
        proxy_pass         http://127.0.0.1:8001;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Forward HTTP Basic Auth headers to the backend
        proxy_set_header   Authorization     $http_authorization;
        proxy_pass_header  Authorization;
    }
}

# ─── Frontend: kupas.id → static files ───────────────────────────────────────
server {
    listen 80;
    server_name kupas.id www.kupas.id;

    root   /var/www/kupas/frontend;
    index  index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# =============================================================================
# Systemd service units to run both FastAPI apps
#
# /etc/systemd/system/kupas-api.service
# ──────────────────────────────────────
# [Unit]
# Description=Kupas Public API
# After=network.target postgresql.service
#
# [Service]
# User=www-data
# WorkingDirectory=/var/www/kupas
# ExecStart=/var/www/kupas/.venv/bin/uvicorn kupas.api.main:app --host 127.0.0.1 --port 8000
# Restart=always
# EnvironmentFile=/var/www/kupas/.env
#
# [Install]
# WantedBy=multi-user.target
#
# ──────────────────────────────────────
# /etc/systemd/system/kupas-admin.service
# ──────────────────────────────────────
# [Unit]
# Description=Kupas Admin Panel
# After=network.target postgresql.service
#
# [Service]
# User=www-data
# WorkingDirectory=/var/www/kupas
# ExecStart=/var/www/kupas/.venv/bin/uvicorn kupas.admin.main:app --host 127.0.0.1 --port 8001
# Restart=always
# EnvironmentFile=/var/www/kupas/.env
#
# [Install]
# WantedBy=multi-user.target
# =============================================================================
