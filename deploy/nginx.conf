# API: api-kupas.dendyfajark.page → kupas-api:8000
server {
    listen 80;
    server_name api-kupas.dendyfajark.page;

    location / {
        proxy_pass         http://kupas-api:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  "https://kupas.dendyfajark.page";
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type, X-API-Key";
            return 204;
        }
    }
}

# Admin: admin-kupas.dendyfajark.page → kupas-admin:8001
server {
    listen 80;
    server_name admin-kupas.dendyfajark.page;

    location / {
        proxy_pass         http://kupas-admin:8001;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Authorization     $http_authorization;
        proxy_pass_header  Authorization;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
    }
}

# Default: tolak semua request yang tidak cocok
server {
    listen 80 default_server;
    server_name _;
    return 444;
}
