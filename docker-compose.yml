version: '3.9'

networks:
  kupas-net:
    driver: bridge

volumes:
  pdf_storage:
  postgres_data:
  ollama_data:

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - kupas-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  kupas-api:
    build: .
    command: uvicorn kupas.api.main:app --host 0.0.0.0 --port 8000 --workers 2
    expose:
      - "8000"
    env_file: .env
    volumes:
      - pdf_storage:/app/kupas/storage/pdf
      - ./gcp-kupas.json:/app/gcp-kupas.json:ro
    environment:
      - GOOGLE_APPLICATION_CREDENTIALS=/app/gcp-kupas.json
      - USE_OLLAMA=true
      - OLLAMA_BASE_URL=http://ollama:11434/v1
      - OLLAMA_MODEL=qwen2.5:7b
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    networks:
      - kupas-net

  ollama:
    image: ollama/ollama:latest
    container_name: kupas-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    networks:
      - kupas-net

  kupas-admin:
    build: .
    command: uvicorn kupas.admin.main:app --host 0.0.0.0 --port 8001
    expose:
      - "8001"
    env_file: .env
    volumes:
      - pdf_storage:/app/kupas/storage/pdf
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kupas-net

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - kupas-api
      - kupas-admin
    restart: unless-stopped
    networks:
      - kupas-net
