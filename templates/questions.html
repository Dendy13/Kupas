<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Soal — {{ ebook }}</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #f5f7fa; color: #222; }
    header { background: #1a73e8; color: #fff; padding: 1.2rem 2rem; }
    header h1 { font-size: 1.6rem; }
    main { max-width: 860px; margin: 2rem auto; padding: 0 1rem; }
    .back-link {
      display: inline-block; margin-bottom: 1.2rem; color: #1a73e8;
      text-decoration: none; font-size: .95rem;
    }
    .back-link:hover { text-decoration: underline; }
    .card { background: #fff; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,.08); padding: 1.5rem; }
    .card h2 { margin-bottom: 1rem; font-size: 1.15rem; color: #1a73e8; word-break: break-word; }
    ol { padding-left: 1.3rem; }
    ol li {
      margin-bottom: 1.1rem; font-size: .95rem; line-height: 1.55;
      white-space: pre-wrap;
    }
    footer { text-align: center; font-size: .8rem; color: #888; margin: 2rem 0 1rem; }
  </style>
</head>
<body>
<header>
  <h1>📝 Soal Latihan</h1>
</header>

<main>
  <a class="back-link" href="{{ url_for('index') }}">← Kembali ke daftar ebook</a>

  <div class="card">
    <h2>Soal untuk: {{ ebook }}</h2>
    <ol>
      {% for soal in questions %}
        <li>{{ soal }}</li>
      {% else %}
        <li style="color:#888;">Tidak ada soal yang dihasilkan.</li>
      {% endfor %}
    </ol>
  </div>
</main>

<footer>Kupas &copy; 2025 — Platform Edukasi Kemdikdasmen</footer>
</body>
</html>
